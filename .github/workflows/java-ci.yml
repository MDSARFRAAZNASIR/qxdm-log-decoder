
name: Java CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 11
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
          
      - name: Run Checkstyle
        run: |
          curl -fsSLo checkstyle.jar \
            https://github.com/checkstyle/checkstyle/releases/download/checkstyle-10.21.4/checkstyle-10.21.4-all.jar
          java -jar checkstyle.jar \
            -c config/checkstyle/checkstyle.xml \
            *.java


      - name: Compile Java source files
        run: javac *.java

      - name: Run parser tests
        run: java ParserTest

      - name: Run hexadecimal utility tests
        run: java HexUtilsTest

      - name: Run CSV exporter tests
        run: java CsvExporterTest

      - name: Run diagnostic analyzer tests
        run: java DiagnosticAnalyzerTest
